host: 0.0.0.0
port: 18088
workers: 1
reload: false
log_level: INFO
nim_instances:
- name: nim-integrate-api
  base_url: https://integrate.api.nvidia.com
  api_key: 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
  models: []
  weight: 100
  max_concurrent: 10
  timeout_seconds: 60.0
  health_check_interval: 30
  enabled: true
  auto_discover: true
gemini_instances:
- name: gemini-default
  api_key: "YOUR_GEMINI_API_KEY_HERE"
  base_url: https://generativelanguage.googleapis.com/v1beta
  models: []
  weight: 100
  max_concurrent: 50
  timeout_seconds: 60.0
  health_check_interval: 30
  enabled: true
  auto_discover: true
ollama_instances:
- name: ollama-local
  base_url: http://localhost:11434
  api_key: null
  models: []
  weight: 100
  max_concurrent: 1
  timeout_seconds: 300.0
  health_check_interval: 15
  enabled: true
  keep_alive: 5m
  gpu_layers: 999
  env_vars:
    CUDA_VISIBLE_DEVICES: '-1'
    OLLAMA_VULKAN: '1'
    GGML_VK_VISIBLE_DEVICES: '0'
    OLLAMA_NUM_GPU: '999'
    OLLAMA_FLASH_ATTENTION: '1'
    OLLAMA_KV_CACHE_TYPE: q8_0
    OLLAMA_NUM_PARALLEL: '1'
  # VRAM-Aware Concurrency Strategy (GTX 1060 6GB = ~5.5GB usable)
  concurrency_strategy: "tiered"
  vram_total_mb: 5500
  vram_safety_margin_mb: 500
  per_model_config:
    # TIER: heavy (single-load only, ~4-5GB each)
    qwen2.5-coder:7b:
      quantization: Q4_K_M
      context_window: 2048
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 999
      num_parallel: 1
      max_loaded_models: 1
      concurrency_tier: "heavy"
      vram_mb: 4200
      temperature: 0.0
      flash_attention: true
      description: Especialista em código - 100% GPU (performance máxima)
    qwen3:8b-gpu90:
      quantization: Q3_K_M
      context_window: 4096
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 32
      num_parallel: 1
      max_loaded_models: 1
      concurrency_tier: "heavy"
      vram_mb: 4800
      temperature: 0.0
      flash_attention: true
      reasoning_effort_default: medium
      reasoning_format: parsed
      description: Reasoning nativo - 90% GPU (32/36 layers), 10% CPU
    deepseek-coder:6.7b:
      quantization: Q4_K_M
      context_window: 2048
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 99
      num_batch: 128
      num_parallel: 1
      max_loaded_models: 1
      concurrency_tier: "heavy"
      vram_mb: 4000
      temperature: 0.0
      flash_attention: true
      description: Otimizado GTX 1060 6GB - 100% GPU offload (num_gpu=99), contexto
        2K, batch 128
    # TIER: light (dual-load OK, ~1-1.5GB each)
    qwen2.5-coder:1.5b:
      quantization: Q4_K_M
      context_window: 2048
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 999
      num_parallel: 1
      max_loaded_models: 2
      concurrency_tier: "light"
      vram_mb: 1000
      temperature: 0.0
      flash_attention: true
      description: Modelo leve para concorrência - 1.5B params
    qwen2.5:0.5b:
      quantization: Q4_K_M
      context_window: 2048
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 999
      num_parallel: 1
      max_loaded_models: 2
      concurrency_tier: "light"
      vram_mb: 400
      temperature: 0.0
      flash_attention: true
      description: Modelo micro para alta concorrência - 0.5B params
    tinyllama:1.1b:
      quantization: Q4_K_M
      context_window: 2048
      context_window_extended: 4096
      kv_cache_quant: Q8_0
      num_gpu: 999
      num_parallel: 1
      max_loaded_models: 2
      concurrency_tier: "light"
      vram_mb: 700
      temperature: 0.0
      flash_attention: true
      description: Modelo leve alternativo - 1.1B params
  defaults:
    quantization: Q4_K_M
    context_window: 2048
    context_window_extended: 4096
    kv_cache_quant: Q8_0
    num_gpu: 999
    num_parallel: 1
    max_loaded_models: 1
    concurrency_tier: "heavy"
    vram_mb: 4000
    temperature: 0.0
    flash_attention: true
    description: Configuração padrão Vulkan para GTX 1060 6GB
rate_limits: {}
default_rate_limit:
  requests_per_minute: 60
  tokens_per_minute: 100000
  burst_allowance: 1.5
  key_prefix: default
circuit_breaker:
  failure_threshold: 5
  success_threshold: 2
  timeout_seconds: 30.0
  half_open_max_calls: 3
admin_ui:
  enabled: true
  host: 0.0.0.0
  port: 8082
  auth_enabled: false
  username: admin
  password_hash: ''
  session_timeout_minutes: 60
metrics:
  enabled: true
  path: /metrics
  port: 9090
logging:
  level: INFO
  format: json
  correlation_header: x-request-id
  include_request_body: false
  include_response_body: false
  max_body_log_length: 1000
stream_timeout_seconds: 300.0
max_stream_buffer_size: 1048576
max_request_body_size: 52428800
